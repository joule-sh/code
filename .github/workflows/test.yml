name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, diff]
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: lumen --version
      - run: zig version
      - run: make build
      - run: make test

  e2e:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make e2e

  terminal-structural:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make terminal-harness

  layout-harness:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make layout-harness

  login-server:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make login-server-harness

  daemon-concurrent:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make daemon-concurrent-harness

  editor:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make editor-harness
      - run: make editor-package

  editor-window:
    runs-on: [self-hosted, diff]
    timeout-minutes: 20
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version && npm --version
      # A real editor window is an Electron window, so this runner needs a
      # display and the GTK stack behind it. Both runners take jobs, so the
      # check runs every time and installs only what is actually missing.
      - name: Make sure this runner can open an editor window
        run: |
          missing=""
          command -v Xvfb >/dev/null || missing="xvfb"
          for lib in libgtk-3.so.0 libnss3.so libasound.so.2 libgbm.so.1 libxkbfile.so.1 libsecret-1.so.0 libatk-bridge-2.0.so.0 libcups.so.2; do
            ldconfig -p | grep -q "$lib" || missing="$missing $lib"
          done
          if [ -z "$missing" ]; then echo "already provisioned"; exit 0; fi
          echo "missing:$missing"
          . /etc/os-release && echo "on $PRETTY_NAME"
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxkbfile1 libsecret-1-0 libatk-bridge2.0-0t64 libcups2t64
      - run: make editor-window-harness
      - if: always()
        run: pkill -f 'Xvfb :' || true

  daemon-attach:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make daemon-attach-harness

  ws-peer-lifecycle:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make ws-peer-lifecycle-harness

  relay-reconnect:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make relay-reconnect-harness

  # Every other job here is a Linux runner, which is why #197 shipped twice:
  # the daemon's frame transport was broken on macOS and nothing on macOS
  # ever ran. This job builds the three binaries on macOS, runs each one,
  # and drives the daemon path end to end there.
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: brew install bdw-gc
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-aarch64-macos.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-aarch64-macos" >> "$GITHUB_PATH"
          echo "$PWD/lumen-aarch64-macos/zig" >> "$GITHUB_PATH"
      - run: lumen --version && zig version && node --version && python3 --version
      - run: make build bin/stub_model
      - run: |
          ./bin/joule --version
          ./bin/relay --version
          ./bin/joule-daemon --version
      # Packaging the binaries the way a release does, and then checking the
      # archive, is what keeps the macOS guard honest between tags: the release
      # workflow only runs on one, so without this the guard itself would go
      # untested until the moment it is relied on (#196).
      - run: |
          dir="code-aarch64-macos"
          mkdir -p "$dir"
          cp bin/joule bin/relay bin/joule-daemon README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          scripts/check_macos_release.sh "$dir.tar.gz"
      - run: make macos-test
      - run: make daemon-concurrent-harness
      - run: make daemon-attach-harness
      - run: make daemon-stop-harness
      - run: make daemon-commands-harness
      - run: make attach-commands-harness
      - run: make ws-peer-lifecycle-harness

  linux-release:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: make release LUMEN_TARGET=x86_64-linux-musl
      - run: scripts/check_linux_release.sh bin/joule bin/relay bin/joule-daemon
      - run: |
          ./bin/joule --version
          ./bin/relay --version
          ./bin/joule-daemon --version
