name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, diff]
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: lumen --version
      - run: zig version
      - run: make build
      - run: make test

  e2e:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make e2e

  terminal-structural:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make terminal-harness

  model-platform-harness:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make model-platform-harness

  layout-harness:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make layout-harness

  skills:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make skills-harness

  cold-start:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make cold-start-harness

  stop-then-start:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make stop-then-start-harness

  memory-files:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make memory-files-harness

  login-server:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make login-server-harness

  daemon-concurrent:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make daemon-concurrent-harness

  editor:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make editor-harness
      - run: make editor-package

  editor-window:
    runs-on: [self-hosted, diff]
    timeout-minutes: 30
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version && npm --version
      # A real editor window is an Electron window, so this runner needs a
      # display, the GTK stack behind it, and ImageMagick to read the bars.
      # Both runners take jobs, so the check installs what is missing.
      - name: Make sure this runner can open an editor window
        run: |
          missing=""
          command -v Xvfb >/dev/null || missing="xvfb"
          command -v import >/dev/null && command -v convert >/dev/null || missing="$missing imagemagick"
          for lib in libgtk-3.so.0 libnss3.so libasound.so.2 libgbm.so.1 libxkbfile.so.1 libsecret-1.so.0 libatk-bridge-2.0.so.0 libcups.so.2; do
            ldconfig -p | grep -q "$lib" || missing="$missing $lib"
          done
          if [ -z "$missing" ]; then echo "already provisioned"; exit 0; fi
          echo "missing:$missing"
          . /etc/os-release && echo "on $PRETTY_NAME"
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -qq --no-install-recommends \
            xvfb imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxkbfile1 libsecret-1-0 libatk-bridge2.0-0t64 libcups2t64
      - run: make editor-window-harness
      - if: always()
        run: pkill -f 'Xvfb :' || true

  # The same real editor window, on Windows. The extension refused to start
  # there at all until #250, and the reason the refusal outlived the Windows
  # binary, the daemon and the npm package is that every check over the panel
  # ran on the Linux runner: lifting it was a claim about a platform nothing
  # tested. This is that claim, run.
  #
  # No Xvfb and no GTK stack here - a Windows runner has a desktop already, so
  # the whole provisioning step above has no counterpart and the same recipe
  # runs unchanged.
  #
  # A subset of the scenarios, named here rather than in the runner so the
  # Linux job stays the one that runs everything. The three that run are the
  # ones whose subject is the daemon: a turn driven from the webview with the
  # approved tool's effect read back off the workspace file, a second client
  # sharing that session, and a panel closed with a turn still running. The
  # ones left out are about where a view lands in the workbench and what a
  # transcript renders - the editor's business rather than the platform's, and
  # two of them want a second VS Code download for the older version. The
  # transcript scenario also runs `sh noisy.sh`, which is not a command the
  # shell on this side has.
  editor-window-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LUMEN_VERSION: v0.7.2
      LUMEN_TARGET: x86_64-windows-gnu
      JOULE_EDITOR_SCENARIOS: conversation,second-client,close-mid-turn
    steps:
      - uses: actions/checkout@v4
      - run: |
          choco install make -y --no-progress
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - run: |
          curl -fsSL -o lumen.zip "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-windows.zip"
          7z x -y lumen.zip > /dev/null
          echo "$PWD/lumen-x86_64-windows" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-windows/zig" >> "$GITHUB_PATH"
      - run: lumen --version && zig version && make --version && node --version && npm --version
      - run: make editor-window-harness

  # No lumen here on purpose. The npm packages carry binaries a release built
  # rather than binaries this job builds, so the checks make their own fixture
  # archives and never need a compiler.
  npm-packaging:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: make npm-check

  daemon-attach:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make daemon-attach-harness

  two-clients:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make two-client-harness

  ws-peer-lifecycle:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make ws-peer-lifecycle-harness

  relay-reconnect:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make relay-reconnect-harness

  # Every other job here is a Linux runner, which is why #197 shipped twice:
  # the daemon's frame transport was broken on macOS and nothing on macOS
  # ever ran. This job builds the three binaries on macOS, runs each one,
  # and drives the daemon path end to end there.
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: brew install bdw-gc
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-aarch64-macos.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-aarch64-macos" >> "$GITHUB_PATH"
          echo "$PWD/lumen-aarch64-macos/zig" >> "$GITHUB_PATH"
      - run: lumen --version && zig version && node --version && python3 --version
      - run: make build bin/stub_model
      - run: |
          ./bin/joule --version
          ./bin/relay --version
          ./bin/joule-daemon --version
      - run: make macos-test
      - run: make cold-start-harness
      - run: make daemon-concurrent-harness
      - run: make daemon-attach-harness
      - run: make daemon-stop-harness
      - run: make stop-then-start-harness
      - run: make daemon-commands-harness
      - run: make attach-commands-harness
      - run: make two-client-harness
      - run: make ws-peer-lifecycle-harness

  # The Windows counterpart to `macos`, and it exists for the same reason that
  # job does: nothing here ran on Windows, so nothing here could tell a Windows
  # build that works from one that compiles. It builds the three binaries,
  # runs each, and then drives the real joule.exe through a pseudoconsole
  # against the stub model - because `--version` exiting 0 proves nothing about
  # a terminal layer that had to be written from scratch. The daemon harness
  # beside it drives the other half: a client that starts a daemon detached and
  # leaves, a second client that joins the session, and a stop.
  #
  # `make test` is not run here and cannot be: `lumen test` builds for the host
  # and a host build stops at the missing Boehm collector, which only naming a
  # target gets built. The suite runs on Linux and macOS, and the parts of it
  # that are about platform behaviour rather than about this repo are the
  # harness below instead.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LUMEN_VERSION: v0.7.2
      LUMEN_TARGET: x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - run: choco install make -y --no-progress
      # make is a native Windows program and inherits the Windows PATH, which
      # does not carry Git's POSIX tools even inside a bash step - bash resolves
      # those itself. Without an sh.exe it can see, make runs each recipe
      # through CreateProcess instead of a shell, and CreateProcess does not
      # append .exe, so the build died on "zig: The system cannot find the file
      # specified". Putting the directory on PATH also gives `$(shell find src
      # ...)` the GNU find the Makefile is written against rather than the
      # unrelated Windows one.
      - run: cygpath -w /usr/bin >> "$GITHUB_PATH"
      - run: |
          curl -fsSL -o lumen.zip "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-windows.zip"
          7z x -y lumen.zip > /dev/null
          echo "$PWD/lumen-x86_64-windows" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-windows/zig" >> "$GITHUB_PATH"
      - run: lumen --version && zig version && make --version && python --version
      - run: make build bin/stub_model.exe
      - run: |
          ./bin/joule.exe --version
          ./bin/relay.exe --version
          ./bin/joule-daemon.exe --version
      - run: make windows-harness
      - run: make windows-daemon-harness

  # The Windows counterpart to linux-release and macos-release, and it exists
  # for the reason those do: the job above builds for the runner with `make
  # build` and runs what it built, so it cannot catch a fault that only the
  # release recipe or the archive has. That is how #196 stayed green through
  # three macOS releases. This repeats `make release`, packages the zip the
  # release publishes, and drives the release binary through the same
  # pseudoconsole harness - a --release-fast build is a different binary and
  # deserves to be run rather than assumed.
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      LUMEN_VERSION: v0.7.2
      LUMEN_TARGET: x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - run: |
          choco install make -y --no-progress
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - run: |
          curl -fsSL -o lumen.zip "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-windows.zip"
          7z x -y lumen.zip > /dev/null
          echo "$PWD/lumen-x86_64-windows" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-windows/zig" >> "$GITHUB_PATH"
      - run: make release
      - run: |
          ./bin/joule.exe --version
          ./bin/relay.exe --version
          ./bin/joule-daemon.exe --version
      - run: |
          dir="code-x86_64-windows"
          mkdir -p "$dir"
          cp bin/joule.exe bin/relay.exe bin/joule-daemon.exe README.md "$dir/"
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          7z l "$dir.zip"
      # `build` finds the release binaries already newer than their sources, so
      # this drives what `make release` just produced rather than rebuilding.
      - run: make windows-harness
      - run: make windows-daemon-harness

  linux-release:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.2
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: make release LUMEN_TARGET=x86_64-linux-musl
      - run: scripts/check_linux_release.sh bin/joule bin/relay bin/joule-daemon
      - run: |
          ./bin/joule --version
          ./bin/relay --version
          ./bin/joule-daemon --version

  # The macOS counterpart to linux-release, and the only job that sees what a
  # release actually publishes. The `macos` job above builds for the runner and
  # runs what it built, so it cannot catch a fault in signing or packaging -
  # that is how #196 stayed green through three releases. This one repeats the
  # release recipe, archive and all, and checks the archive. It is a job of its
  # own rather than more steps on `macos` because `brew unlink bdw-gc` would
  # pull the collector out from under the dynamically linked binaries the
  # harnesses there are still using.
  #
  # Both architectures, because until #255 neither this job nor `macos` ran on
  # Intel at all: x86_64 was built for the first time when a tag was pushed,
  # which is where a release-blocking fault got to hide. The two differ in what
  # they are allowed to carry - only arm64 is ad-hoc signed, for the reason
  # spelled out in scripts/check_macos_release.sh - so the guard reads the
  # target rather than assuming one rule for both.
  macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runs_on: macos-14
            lumen_dist: lumen-aarch64-macos
          - target: x86_64-macos
            runs_on: macos-15-intel
            lumen_dist: lumen-x86_64-macos
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: brew install bdw-gc
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/${{ matrix.lumen_dist }}.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/${{ matrix.lumen_dist }}" >> "$GITHUB_PATH"
          echo "$PWD/${{ matrix.lumen_dist }}/zig" >> "$GITHUB_PATH"
      - run: |
          mkdir -p "$PWD/gcstatic"
          cp "$(brew --prefix bdw-gc)/lib/libgc.a" "$PWD/gcstatic/"
          brew unlink bdw-gc
          echo "LUMEN_FLAGS=--link -L$PWD/gcstatic" >> "$GITHUB_ENV"
      - run: make release
      - if: matrix.target == 'aarch64-macos'
        run: |
          for bin in bin/joule bin/relay bin/joule-daemon; do
            codesign --sign - --force "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - run: |
          dir="code-${{ matrix.target }}"
          mkdir -p "$dir"
          cp bin/joule bin/relay bin/joule-daemon README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - run: scripts/check_macos_release.sh "code-${{ matrix.target }}.tar.gz"

  # Installing over an existing install is the step #235 broke on, and it is
  # arm64 macOS behaviour, so it is checked on the same runner the release is
  # built on. The check is about inodes rather than exec - these images have
  # SIP off and enforce no signature at all (#196) - so what a green run here
  # says is that the installer never wrote over a binary this machine had
  # already execed, and that everything it left behind still passes codesign.
  install-swap-macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check_install_swap.sh install.sh

  # The same check on Linux, where /bin/sh is dash rather than bash. The inode
  # assertion means the same thing here; this job is what keeps install.sh
  # honestly POSIX as well as correct.
  install-swap-linux:
    runs-on: [self-hosted, diff]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check_install_swap.sh install.sh
