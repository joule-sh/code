name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, diff]
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: lumen --version
      - run: zig version
      - run: make build
      - run: make test

  e2e:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make e2e

  terminal-structural:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make terminal-harness

  login-server:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make login-server-harness

  daemon-concurrent:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make daemon-concurrent-harness

  editor:
    runs-on: [self-hosted, diff]
    timeout-minutes: 10
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make editor-harness
      - run: make editor-package

  editor-window:
    runs-on: [self-hosted, diff]
    timeout-minutes: 20
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version && npm --version
      - run: make editor-window-harness
      - if: always()
        run: pkill -f 'Xvfb :' || true

  daemon-attach:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: python3 --version
      - run: make daemon-attach-harness

  ws-peer-lifecycle:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make ws-peer-lifecycle-harness

  relay-reconnect:
    runs-on: [self-hosted, diff]
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: node --version
      - run: make relay-reconnect-harness
