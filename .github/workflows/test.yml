name: test

# The Linux jobs run on GitHub-hosted runners, which start clean. A host
# `lumen compile` resolves the Boehm collector as a system library, so every
# job that builds for the host installs libgc-dev; the jobs that name a
# target build their own collector and need nothing. The two jobs that open a
# window install the display stack for the same reason - none of it was ever
# written down while one long-lived machine happened to have it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LUMEN_VERSION: v0.7.5
    steps:
      - uses: actions/checkout@v4
      - name: Install the Boehm collector a host build links against
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgc-dev
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/lumen-x86_64-linux.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/lumen-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/lumen-x86_64-linux/zig" >> "$GITHUB_PATH"
      - run: lumen --version
      - run: zig version
      - run: make build
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LUMEN_VERSION: v0.7.5
    steps:
      - uses: actions/checkout@v4
