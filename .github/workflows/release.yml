name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Every target tracks the same lumen again. v0.7.5 is the first release
    # that both reads back through a TLS-terminated websocket (spec 496,
    # which the relay client needs) and takes `--library-path <dir>` (spec
    # 497), the replacement for the `--link -L<dir>` that v0.7.2 began
    # refusing and that had held macOS on v0.7.1 ever since (#211).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs_on: [self-hosted, diff]
            lumen_dist: lumen-x86_64-linux
            exe: ""
          - target: aarch64-macos
            runs_on: macos-14
            lumen_dist: lumen-aarch64-macos
            exe: ""
          - target: x86_64-macos
            runs_on: macos-15-intel
            lumen_dist: lumen-x86_64-macos
            exe: ""
          - target: x86_64-windows
            runs_on: windows-latest
            lumen_dist: lumen-x86_64-windows
            exe: ".exe"
    runs-on: ${{ matrix.runs_on }}
    # Every step here is written for a POSIX shell, and the Windows runner's
    # default is PowerShell. Naming bash once is less to get wrong than
    # maintaining a second spelling of each step, and Git for Windows - which
    # supplies it - is also where make finds an sh to run the Makefile's own
    # `find` under.
    defaults:
      run:
        shell: bash
    env:
      LUMEN_VERSION: v0.7.5
    steps:
      - uses: actions/checkout@v4
      # make is a native Windows program and inherits the Windows PATH, which
      # does not carry Git's POSIX tools even inside a bash step - bash resolves
      # those itself. Without an sh.exe it can see, make runs each recipe
      # through CreateProcess instead of a shell, and CreateProcess does not
      # append .exe, so the build dies on "zig: The system cannot find the file
      # specified". Putting the directory on PATH also gives `$(shell find src
      # ...)` the GNU find the Makefile is written against.
      - if: runner.os == 'Windows'
        run: |
          choco install make -y --no-progress
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      # Lumen's allocator links the Boehm collector as a system library. macOS
      # has none, so Homebrew provides it. Linux needs nothing installed here:
      # the static build below compiles its own - see the Linux step.
      - if: runner.os == 'macOS'
        run: brew install bdw-gc
      # The Windows toolchain is published as a .zip rather than a .tar.gz, and
      # is unpacked with 7z rather than tar: the tar on PATH inside Git Bash is
      # GNU tar, which does not read zip, and Expand-Archive takes minutes over
      # twenty thousand files.
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o lumen.zip "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/${{ matrix.lumen_dist }}.zip"
            7z x -y lumen.zip > /dev/null
          else
            curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/${{ matrix.lumen_dist }}.tar.gz"
            tar -xzf lumen.tar.gz
          fi
          echo "$PWD/${{ matrix.lumen_dist }}" >> "$GITHUB_PATH"
          echo "$PWD/${{ matrix.lumen_dist }}/zig" >> "$GITHUB_PATH"
      - run: |
          version="${GITHUB_REF_NAME#v}"
          echo "export const VERSION: string = \"$version\";" > src/version.ts
          cat src/version.ts
      # Link the collector statically so a released macOS binary depends on
      # nothing but libSystem. Two things make that work. The backend prefers a
      # dylib whenever it can see one, so the static archive is staged alone in
      # its own directory and Homebrew's dylib symlinks are unlinked. And Zig
      # ignores LIBRARY_PATH on macOS while knowing only Apple Silicon's
      # /opt/homebrew, so the directory is named with --library-path, which
      # lumen forwards to the backend ahead of its own -lgc.
      - if: runner.os == 'macOS'
        run: |
          mkdir -p "$PWD/gcstatic"
          cp "$(brew --prefix bdw-gc)/lib/libgc.a" "$PWD/gcstatic/"
          brew unlink bdw-gc
          echo "LUMEN_FLAGS=--library-path $PWD/gcstatic" >> "$GITHUB_ENV"
      # Linux goes further, because a bundled collector next to a dynamic libc
      # still leaves a glibc floor, and an archive that cannot satisfy either
      # installs fine and then dies in the loader (#184). Naming a musl target
      # links the collector, libc and all in one file, so the binary needs
      # nothing at all from the machine it lands on.
      - if: runner.os == 'Linux'
        run: echo "LUMEN_TARGET=x86_64-linux-musl" >> "$GITHUB_ENV"
      # Windows names a target for a different reason than Linux does. There is
      # no Boehm collector to find on a Windows runner and no package manager
      # step above puts one there, so a host build stops at "unable to find
      # dynamic system library 'gc'"; naming the target has lumen build the
      # collector itself, exactly as the musl build does. The -gnu suffix picks
      # mingw over msvc, whose libc needs a Windows SDK the backend cannot find.
      - if: runner.os == 'Windows'
        run: echo "LUMEN_TARGET=x86_64-windows-gnu" >> "$GITHUB_ENV"
      - run: make release
      # The backend ad-hoc signs what it links for Apple Silicon and leaves
      # x86_64 unsigned, which is why #196 shipped Apple Silicon binaries the
      # kernel killed on exec. Re-signing here settles that, and it is done on
      # arm64 only.
      #
      # Signing x86_64 as well - which is what #196 did, to give the two one
      # rule - is what blocked v0.20.0 (#255). The backend leaves an x86_64
      # Mach-O with no room between its load commands and __text: the header is
      # 32 bytes, sizeofcmds is 2064, and __text begins at file offset 2096.
      # `codesign` has to add a 16-byte LC_CODE_SIGNATURE, so it grows the
      # header to 2112 and writes those bytes over the first function in
      # __text. The linker puts the C shim's code there, so plat_env is what
      # gets destroyed, and relay reads the environment before it looks at
      # argv - so `relay --version` faulted, and Zig's segfault handler then
      # span forever in its own DWARF unwinder rather than dying. Nothing on
      # arm64 is affected: the backend already emitted LC_CODE_SIGNATURE there,
      # so re-signing replaces a blob in place and grows no header.
      #
      # The kernel asks for a signature on arm64 and asks for nothing on
      # x86_64, where unsigned binaries have always run, so shipping Intel
      # unsigned gives up nothing an ad-hoc signature was providing. It comes
      # back when lumen can either sign x86_64 itself or pass the linker
      # -headerpad_max_install_names; today `--link` only takes a library name,
      # so there is no way to ask for the padding from here.
      - if: runner.os == 'macOS' && matrix.target == 'aarch64-macos'
        run: |
          for bin in bin/joule bin/relay bin/joule-daemon; do
            codesign --sign - --force "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - run: ./bin/joule${{ matrix.exe }} --version
      - run: ./bin/joule-daemon${{ matrix.exe }} --version
      - if: runner.os == 'Linux'
        run: scripts/check_linux_release.sh bin/joule bin/relay bin/joule-daemon
      # A --version that exits 0 says nothing about the terminal, which is the
      # half of a Windows build that had to be written from scratch. This
      # starts the binary it just built inside a real pseudoconsole - the same
      # mechanism Windows Terminal hosts a console program with - and drives a
      # turn against the stub model. What it asserts is what works today; the
      # gaps it deliberately does not assert are listed in its header.
      - if: runner.os == 'Windows'
        run: make windows-harness
      # And the daemon, which is what the terminal above now runs its turn
      # through and what the editor extension talks to. A release that ships a
      # joule-daemon.exe nothing can start is the shape of #196.
      - if: runner.os == 'Windows'
        run: make windows-daemon-harness
      - run: |
          dir="code-${{ matrix.target }}"
          mkdir -p "$dir"
          cp bin/joule${{ matrix.exe }} bin/relay${{ matrix.exe }} bin/joule-daemon${{ matrix.exe }} README.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      # Against the archive, not against bin/. The binaries above are the ones
      # this runner just built and has already run; a signature or packaging
      # fault only exists in the thing that gets published, which is why a
      # green macOS job and a download killed on exec were consistent for three
      # releases (#196). The dynamic-libgc guard lives in there too now, for
      # the same reason and to match how Linux is checked.
      - if: runner.os == 'macOS'
        run: scripts/check_macos_release.sh "code-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: code-${{ matrix.target }}
          path: |
            code-${{ matrix.target }}.tar.gz
            code-${{ matrix.target }}.zip
          if-no-files-found: error

  extension:
    runs-on: [self-hosted, diff]
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node scripts/package_editor.mjs --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: code-editor-extension
          path: dist/*.vsix
          if-no-files-found: error

  # The npm packages are cut from the archives the build jobs already produced,
  # not from a second build, for the same reason the extension is: what the
  # registry serves has to be the bytes the release carries. Unpacking an
  # archive and repacking it as a tarball is all this does, so it needs no
  # toolchain and takes seconds.
  #
  # A signed macOS binary survives that round trip untouched - `npm pack` is a
  # gzipped tar and `npm install` restores the bytes exactly, which
  # `scripts/verify_npm_wrapper.mjs` checks by installing what it packed and
  # running it. The signature lives inside the Mach-O itself, so there is
  # nothing beside the file for packing to lose.
  #
  # #235 does not arise here the way it does for install.sh. The kernel caches
  # a signature against the vnode rather than the path, and npm extracts a new
  # file for every install rather than writing over the one already there, so
  # no binary is ever execed through a vnode the kernel has already judged. The
  # install step verifies and ad-hoc signs on macOS anyway, the way install.sh
  # does, because it costs nothing and it checks the bytes that actually landed.
  npm:
    needs: [build]
    runs-on: [self-hosted, diff]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: code-*
          merge-multiple: true
      - run: node scripts/package_npm.mjs --version "$GITHUB_REF_NAME" --artifacts .
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
          if-no-files-found: error

  release:
    needs: [build, extension]
    runs-on: [self-hosted, diff]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: code-*
          merge-multiple: true
      - run: ls -l code-*.tar.gz code-*.zip *.vsix
      - run: |
          gh release create "$GITHUB_REF_NAME" code-*.tar.gz code-*.zip *.vsix \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishing is downstream of the release, in its own job, and takes the file
  # the release already carries rather than packaging a second one. Two reasons.
  # A registry serving different bytes from the `.vsix` on the release is a
  # difference nobody would ever find, and a token that expired last week, or a
  # marketplace having an afternoon, then costs nobody the release itself - it
  # is already cut by the time this runs.
  #
  # It is inert until someone adds a token. `scripts/publish_editor.mjs` skips a
  # registry it has no secret for, names the secret that was missing, and exits
  # 0, so a repository with neither secret set releases exactly as it does with
  # this job absent. What it will not do is stay quiet: a skip and a publish
  # read differently in the log and in the job summary, and a release that
  # reached one registry and not the other fails the job saying which is which.
  # docs/05-publishing.md is what the two secrets need behind them.
  #
  # The tag and the artifact path are left to the script, which derives both the
  # same way `package_editor.mjs` does and is checked against them by
  # `scripts/verify_editor_publish.mjs` in `make editor-check`.
  publish:
    needs: [release]
    runs-on: [self-hosted, diff]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: code-editor-extension
          path: dist
      - run: node scripts/publish_editor.mjs
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Downstream of the release for the same reasons the extension's publish job
  # is, and inert in the same way: with no NPM_TOKEN, `scripts/publish_npm.mjs`
  # says which secret was missing and exits 0, so a repository without the
  # secret releases exactly as it does with this job absent.
  #
  # Order is the thing this job exists to get right. Every platform package is
  # published before the wrapper, because the wrapper names them as
  # optionalDependencies and npm treats one it cannot find as a package to skip
  # rather than an error - so a wrapper published first is a version that
  # installs cleanly and then has no binary. If a platform package fails, the
  # wrapper is held back and the job fails saying so. That leaves a release
  # with no wrapper version at all, which is recoverable: re-running the job
  # skips whatever is already on the registry and publishes the rest. The
  # alternative is a permanently broken version, and npm only allows an
  # unpublish within 72 hours of the publish.
  #
  # The token is never written down. The npmrc this creates holds the literal
  # `${NPM_TOKEN}`, which npm expands out of the environment when it reads it.
  publish-npm:
    needs: [release, npm]
    runs-on: [self-hosted, diff]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - run: node scripts/publish_npm.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
