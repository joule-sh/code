name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Linux needs v0.7.2, which is the first release whose backend can be asked
    # for a target and a static link. macOS stays on v0.7.1 because v0.7.2 also
    # stopped accepting `--link -L<dir>`, which is how the macOS steps below
    # point the linker at Homebrew's static `libgc.a`; moving macOS off that is
    # a change to the macOS release path, and belongs with the tickets that own
    # it rather than here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs_on: [self-hosted, diff]
            lumen_dist: lumen-x86_64-linux
            lumen_version: v0.7.2
          - target: aarch64-macos
            runs_on: macos-14
            lumen_dist: lumen-aarch64-macos
            lumen_version: v0.7.1
          - target: x86_64-macos
            runs_on: macos-15-intel
            lumen_dist: lumen-x86_64-macos
            lumen_version: v0.7.1
    runs-on: ${{ matrix.runs_on }}
    env:
      LUMEN_VERSION: ${{ matrix.lumen_version }}
    steps:
      - uses: actions/checkout@v4
      # Lumen's allocator links the Boehm collector as a system library. macOS
      # has none, so Homebrew provides it. Linux needs nothing installed here:
      # the static build below compiles its own - see the Linux step.
      - if: runner.os == 'macOS'
        run: brew install bdw-gc
      - run: |
          curl -fsSL -o lumen.tar.gz "https://github.com/lumen-lang-org/lumen/releases/download/${LUMEN_VERSION}/${{ matrix.lumen_dist }}.tar.gz"
          tar -xzf lumen.tar.gz
          echo "$PWD/${{ matrix.lumen_dist }}" >> "$GITHUB_PATH"
          echo "$PWD/${{ matrix.lumen_dist }}/zig" >> "$GITHUB_PATH"
      - run: |
          version="${GITHUB_REF_NAME#v}"
          echo "export const VERSION: string = \"$version\";" > src/version.ts
          cat src/version.ts
      # Link the collector statically so a released macOS binary depends on
      # nothing but libSystem. Two things make that work. The backend prefers a
      # dylib whenever it can see one, so the static archive is staged alone in
      # its own directory and Homebrew's dylib symlinks are unlinked. And Zig
      # ignores LIBRARY_PATH on macOS while knowing only Apple Silicon's
      # /opt/homebrew, so the directory is passed as an explicit -L, which
      # lumen forwards to the backend ahead of its own -lgc.
      - if: runner.os == 'macOS'
        run: |
          mkdir -p "$PWD/gcstatic"
          cp "$(brew --prefix bdw-gc)/lib/libgc.a" "$PWD/gcstatic/"
          brew unlink bdw-gc
          echo "LUMEN_FLAGS=--link -L$PWD/gcstatic" >> "$GITHUB_ENV"
      # Linux goes further, because a bundled collector next to a dynamic libc
      # still leaves a glibc floor, and an archive that cannot satisfy either
      # installs fine and then dies in the loader (#184). Naming a musl target
      # links the collector, libc and all in one file, so the binary needs
      # nothing at all from the machine it lands on.
      - if: runner.os == 'Linux'
        run: echo "LUMEN_TARGET=x86_64-linux-musl" >> "$GITHUB_ENV"
      - run: make release
      # The backend ad-hoc signs what it links for Apple Silicon and leaves
      # x86_64 unsigned, so half of every macOS release went out carrying no
      # signature at all (#196). Signing both here gives the two one rule, and
      # costs nothing to do: an ad-hoc signature needs no Apple account and no
      # certificate. It is not notarisation - a downloaded archive is still
      # unknown to Gatekeeper - but it settles the part that was fatal, which
      # is the kernel on Apple Silicon killing on exec anything it cannot check
      # a signature for.
      - if: runner.os == 'macOS'
        run: |
          for bin in bin/joule bin/relay bin/joule-daemon; do
            codesign --sign - --force "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - run: ./bin/joule --version
      - run: ./bin/joule-daemon --version
      - if: runner.os == 'Linux'
        run: scripts/check_linux_release.sh bin/joule bin/relay bin/joule-daemon
      - run: |
          dir="code-${{ matrix.target }}"
          mkdir -p "$dir"
          cp bin/joule bin/relay bin/joule-daemon README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      # Against the archive, not against bin/. The binaries above are the ones
      # this runner just built and has already run; a signature or packaging
      # fault only exists in the thing that gets published, which is why a
      # green macOS job and a download killed on exec were consistent for three
      # releases (#196). The dynamic-libgc guard lives in there too now, for
      # the same reason and to match how Linux is checked.
      - if: runner.os == 'macOS'
        run: scripts/check_macos_release.sh "code-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: code-${{ matrix.target }}
          path: code-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  extension:
    runs-on: [self-hosted, diff]
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node scripts/package_editor.mjs --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: code-editor-extension
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: [build, extension]
    runs-on: [self-hosted, diff]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: code-*
          merge-multiple: true
      - run: ls -l code-*.tar.gz *.vsix
      - run: |
          gh release create "$GITHUB_REF_NAME" code-*.tar.gz *.vsix \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
